version: 2
# Every entry waits a week before proposing a new version (`cooldown`):
# malicious releases are usually found and pulled within days (#93). Version
# updates only; security updates still arrive at once.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # React 19 for the popup buys nothing it needs, and the bump only works
      # as react + react-dom + both type packages at once; Dependabot splits
      # them into PRs that each fail to install (#86, #97). Delete these to
      # reconsider, and do it as one change tested in Chrome.
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # React 19 measured at +14.5 kB gzip (+26%) on the built site, for no
      # gain: its custom-element improvements are properties and events, and
      # <ij-footer> has an attributes-only API that React 18 already handles.
      # Declining that trade on a page whose whole argument is page weight.
      # See the measurement in PR #46 / #42. Delete these two entries to
      # reconsider — src/ij-elements.d.ts is already React 19-compatible.
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
