name: Publish extension

# Publishes the store build (no `debugger`) to the Chrome Web Store through
# Chrome Web Store API V2.
# - A version tag (v*) publishes.
# - A manual run (Actions tab → workflow_dispatch) defaults to `check`, which
#   only asks the API for the item's status and changes nothing.
#
# Authentication is keyless (#72). GitHub's OIDC token is exchanged, through
# Workload Identity Federation, for a short-lived Google access token for the
# service account the Developer Dashboard lists as this publisher's. Nothing
# expires, nothing needs rotating, and the repo holds no Google secret. Google
# accepts the token only from this repo and JarlLyng/BotLens.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables),
# none of them a credential:
#   CWS_WIF_PROVIDER, CWS_SERVICE_ACCOUNT, CWS_PUBLISHER_ID
# The extension ID is public (it is in the store URL), so it is hardcoded below.
#
# This workflow never runs on pull_request, so a pull request from a fork
# cannot obtain a token.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mode:
        description: 'check: verify authentication only. draft: upload without submitting. publish: upload and submit for review.'
        type: choice
        options: [check, draft, publish]
        # The safe side on purpose: publishing to a store should take a
        # decision, not the absence of one.
        default: check

permissions:
  contents: read
  id-token: write # lets google-github-actions/auth request GitHub's OIDC token

concurrency:
  group: cws-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # A tag push always publishes; a manual run does what the input says.
      MODE: ${{ github.event_name == 'push' && 'publish' || inputs.mode }}
      EXTENSION_ID: mkajolhhjdlpmjlgdfnmbhfpbbeebgja
      PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json version ($PKG) does not match tag ($TAG)"
            exit 1
          fi

      - name: Type-check & test
        run: |
          npm run typecheck
          npm test

      - name: Build & package store build
        run: npm run package:store # → pagelens-store.zip (debugger-free)

      # Fails fast with a readable message instead of an API error.
      - name: Check configuration
        env:
          WIF_PROVIDER: ${{ vars.CWS_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
        run: |
          for v in WIF_PROVIDER SERVICE_ACCOUNT PUBLISHER_ID; do
            [ -n "${!v}" ] || { echo "::error::$v is not set (see the comment at the top of this workflow)."; exit 1; }
          done

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false

      - name: Chrome Web Store (${{ env.MODE }})
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          if [ "$MODE" = "check" ]; then
            node scripts/cws.mjs check
          else
            node scripts/cws.mjs "$MODE" pagelens-store.zip
          fi
